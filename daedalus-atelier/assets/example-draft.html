<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Today — Draft</title>
<!-- Draft answers one question: does a time-first "Timetable" layout, with the "Queue"
     concept's one-tap action grafted on, hold at 375px and 1440px in both themes?
     Worked example for daedalus-atelier — see example-design-record.md. -->
<style>
  :root {
    /* primitive */
    --slate-50: #F8FAFC; --slate-600: #475569; --slate-900: #0F172A; --white: #FFFFFF;
    --teal-700: #0F766E; --red-700: #B91C1C;
    --ink-950: #0B1220; --ink-900: #111A2E; --slate-200: #E2E8F0; --slate-400: #94A3B8;
    --teal-400: #2DD4BF; --red-400: #F87171;
    /* semantic */
    --color-bg: var(--slate-50);
    --color-surface: var(--white);
    --color-text: var(--slate-900);
    --color-text-muted: var(--slate-600);
    --color-action: var(--teal-700);
    --color-on-action: var(--white);
    --color-danger: var(--red-700);
    --color-line: #E2E8F0;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
    --radius: 6px;
    --motion-fast: 150ms;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-num: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg: var(--ink-950); --color-surface: var(--ink-900);
      --color-text: var(--slate-200); --color-text-muted: var(--slate-400);
      --color-action: var(--teal-400); --color-on-action: var(--ink-950);
      --color-danger: var(--red-400); --color-line: #1E293B;
    }
  }
  :root[data-theme="dark"] {
    --color-bg: var(--ink-950); --color-surface: var(--ink-900);
    --color-text: var(--slate-200); --color-text-muted: var(--slate-400);
    --color-action: var(--teal-400); --color-on-action: var(--ink-950);
    --color-danger: var(--red-400); --color-line: #1E293B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font: 16px/1.4 var(--font-ui); }
  header { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between;
           padding: var(--space-4); border-bottom: 1px solid var(--color-line); }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .date { color: var(--color-text-muted); font-size: 14px; }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: var(--radius); padding: var(--space-2) var(--space-4);
         background: var(--color-action); color: var(--color-on-action); cursor: pointer; min-height: 44px; }
  .btn:focus-visible, .act:focus-visible { outline: 3px solid var(--color-action); outline-offset: 2px; }
  main { max-width: 960px; margin: 0 auto; padding: var(--space-4); }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 5.5rem 1fr auto; gap: var(--space-4); align-items: center;
       padding: var(--space-3) var(--space-4); background: var(--color-surface); border-bottom: 1px solid var(--color-line); }
  li:first-child { border-radius: var(--radius) var(--radius) 0 0; }
  li:last-child { border-radius: 0 0 var(--radius) var(--radius); border-bottom: 0; }
  time { font: 600 28px/1 var(--font-num); letter-spacing: -0.02em; }  /* the thesis risk: time outranks name */
  .who { font-size: 16px; }
  .why { color: var(--color-text-muted); font-size: 14px; }
  .free .who { color: var(--color-text-muted); font-style: italic; }
  .late time { color: var(--color-danger); }
  .act { font: inherit; font-size: 14px; font-weight: 600; background: none; color: var(--color-action);
         border: 1px solid currentColor; border-radius: var(--radius); padding: var(--space-2) var(--space-3); min-height: 44px; cursor: pointer; }
  @media (max-width: 480px) {
    li { grid-template-columns: 4.25rem 1fr; }
    time { font-size: 22px; }
    .act { grid-column: 2; justify-self: start; }
  }
  @media (prefers-reduced-motion: no-preference) { .act, .btn { transition: opacity var(--motion-fast) ease-out; } }
  .act:hover, .btn:hover { opacity: .85; }
</style>
</head>
<body>
<header>
  <div><h1>Today</h1><div class="date">Monday 28 September</div></div>
  <button class="btn" type="button">+ Walk-in</button>
</header>
<main>
  <ol aria-label="Appointments today">
    <li class="late"><time datetime="08:00">08:00</time>
      <div><div class="who">Somchai P.</div><div class="why">Check-up · 12 min late</div></div>
      <button class="act" type="button">Reschedule</button></li>
    <li class="free"><time datetime="08:30">08:30</time>
      <div><div class="who">Free</div></div>
      <button class="act" type="button">Book</button></li>
    <li><time datetime="09:00">09:00</time>
      <div><div class="who">Anna K.</div><div class="why">Follow-up</div></div>
      <button class="act" type="button">Reschedule</button></li>
    <li><time datetime="09:30">09:30</time>
      <div><div class="who">Niran T.</div><div class="why">Vaccination</div></div>
      <button class="act" type="button">Reschedule</button></li>
  </ol>
</main>
</body>
</html>
